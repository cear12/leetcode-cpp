name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cmake:
    uses: cear12/ci-workflows/.github/workflows/cmake.yml@v1
    with:
      # LeetCode-style solutions never free their nodes (on the real judge the
      # harness owns them), so LeakSanitizer is off; ASan and UBSan still run.
      detect-leaks: false
